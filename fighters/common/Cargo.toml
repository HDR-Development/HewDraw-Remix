[package]
name = "common"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
skyline = { git = "https://github.com/ultimate-research/skyline-rs" }
skyline_smash = { git = "https://github.com/ultimate-research/skyline-smash", features = ["weak_l2cvalue"] }
smash_script = { git = "https://github.com/WuBoytH/smash-script.git", branch = "development" }
smashline = { git = "https://github.com/HDR-Development/smashline.git" }
utils = { package = "dynamic", path = "../../dynamic" }
ninput = { git = "https://github.com/HDR-Development/ninput" }
interpolation = "0.2.0" # for f32::lerp
smash_rs = { package = "smash", git = "https://github.com/WuBoytH/smash-rs" }
rand = { git = "https://github.com/skyline-rs/rand" }
proc-hitbox = { git = "https://github.com/HDR-Development/compile-time-smash-script" }
proc-hitbox-macro = { git = "https://github.com/HDR-Development/compile-time-smash-script" }
chrono = "0.4"
