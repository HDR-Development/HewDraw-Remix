    #   if: steps.package_latest.outcome != 'failure'
    #   uses: svenstaro/upload-release-action@2.11.5
    #   with:
    #     repo_token: ${{ secrets.RELEASE_TOKEN }}
    #     file: upgrade_artifacts/deletions.json
