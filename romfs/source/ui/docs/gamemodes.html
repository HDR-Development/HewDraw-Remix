      .footer {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;

        text-align: center;
      }
      #focus-text {
        line-height: 1.4;
        white-space: pre-line;
      }
      .column {
        float: left;
        width: 30%;
        padding: 5px;
        box-sizing: border-box;
      }
      .column-left {
        float: left;
        width: 40%;
        padding: 5px;
        box-sizing: border-box;
      }
      #gamemode-preview {
        width: 100%;
        height: auto;
        margin-top: 10px;
        display: block;
      }
      .row:after {
        content: "";
        display: table;
        clear: both;
      }
